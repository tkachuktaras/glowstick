# Tests and build on every push/PR; on a vX.Y.Z tag — also a release with the exe and SHA-256.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\test.ps1

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match VERSION $v" }

      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: SHA-256
        shell: powershell
        run: |
          $h = (Get-FileHash 'dist\Glowstick.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  Glowstick.exe" | Out-File -Encoding ascii dist\SHA256.txt
          Get-Content dist\SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Glowstick
          path: |
            dist/Glowstick.exe
            dist/SHA256.txt

      # Every commit on main -> one rolling "latest" pre-release that is replaced each time (always a fresh download)
      - name: Rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: "Automatic build of the newest commit on main. For stable downloads use a versioned release."
          files: |
            dist/Glowstick.exe
            dist/SHA256.txt

      # A real version tag -> a normal, non-pre release with notes
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Glowstick.exe
            dist/SHA256.txt
